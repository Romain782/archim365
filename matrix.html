<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>M365 Licensing — Matrix Sales</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <link rel="stylesheet" href="style.css"/>
</head>

<body>
  <div class="app">
    
    <div class="topbar">
      <div class="container">
        <div class="topbar-inner">
          <div class="brand">
            <div class="brand-logo"><i class="fa-brands fa-microsoft"></i></div>
            <div class="brand-text">
              <h1>M365 Licensing Matrix</h1>
              <p>Outil d'aide à la vente • Comparateur détaillé</p>
            </div>
          </div>
          
          <div class="nav-actions">
            <a href="architecture.html" class="btn"><i class="fa-solid fa-diagram-project"></i> Architecture</a>
            <button class="btn active"><i class="fa-solid fa-table"></i> Matrix Sales</button>
          </div>
        </div>
      </div>
    </div>

    <main class="container">
      <div class="view-panel">
        
        <div class="panel-header">
          <div class="panel-title">
            <h2>Comparateur de Fonctionnalités</h2>
            <p>Recherchez une feature technique pour voir dans quelle suite elle est incluse.</p>
          </div>
        </div>

        <div class="matrix-search-container">
          <div class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="q" class="search-input" placeholder="Rechercher une capacité (ex: Bitlocker, PIM, eDiscovery, DLP...)" autofocus>
          </div>
        </div>

        <div class="matrix-table-container thin-scroll">
          <table>
            <thead>
              <tr>
                <th>Feature / Capability</th>
                <th>M365 E3</th>
                <th>M365 E5</th>
                <th>Defender Suite</th>
                <th>Purview Suite</th>
              </tr>
            </thead>
            <tbody id="mxTbody">
              <tr><td colspan="5" style="text-align:center; padding:30px;">Chargement des données...</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <script>
    /* ============================================================
       LOGIQUE : CHARGEMENT JSON & AFFICHAGE
    ============================================================ */
    
    // Variables globales
    let MATRIX_DATA = [];
    const tbody = document.getElementById("mxTbody");
    const qInput = document.getElementById("q");

    // 1. Fonction de chargement du fichier JSON externe
    async function loadData() {
      try {
        // Fetch cherche le fichier dans le même dossier
        const response = await fetch('datamatrix.json'); 
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        MATRIX_DATA = data.matrix; // On stocke la partie 'matrix' du JSON
        renderMatrix(); // On lance l'affichage initial
        
      } catch (error) {
        console.error("Erreur de chargement du JSON :", error);
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align:center; padding:40px; color:#ef4444;">
              <i class="fa-solid fa-triangle-exclamation" style="font-size:24px; margin-bottom:10px;"></i><br>
              <strong>Impossible de charger 'datamatrix.json'.</strong><br><br>
              <em>Note technique : Si vous ouvrez ce fichier en local (file://), les navigateurs bloquent le chargement JSON par sécurité (CORS).</em><br>
              Utilisez <strong>VS Code Live Server</strong> ou hébergez les fichiers sur GitHub Pages.
            </td>
          </tr>
        `;
      }
    }

    // 2. Fonction d'affichage (Rendering) avec filtre de recherche
    function renderMatrix() {
      const query = qInput.value.toLowerCase().trim();
      let html = "";

      if(!MATRIX_DATA || MATRIX_DATA.length === 0) return;

      MATRIX_DATA.forEach(group => {
        // On filtre les items de la catégorie selon la recherche
        const matchingItems = group.items.filter(item => item.name.toLowerCase().includes(query));
        
        // On affiche la catégorie seulement si elle contient des résultats
        if(matchingItems.length > 0) {
          // Ligne d'en-tête de catégorie
          html += `<tr class="tr-category"><td colspan="5">${group.category}</td></tr>`;
          
          // Lignes de features
          matchingItems.forEach(item => {
            html += `<tr>
              <td>${item.name}</td>
              ${item.vals.map(code => {
                let cls="na", ico="fa-minus", txt="-";
                
                // Mapping des codes JSON vers classes CSS
                if(code===1){ cls="included"; ico="fa-check"; txt="Included"; }
                if(code===2){ cls="addon"; ico="fa-plus"; txt="Add-on"; }
                if(code===3){ cls="partial"; ico="fa-circle-half-stroke"; txt="Partial"; }
                
                return `<td><span class="badge ${cls}"><i class="fa-solid ${ico}"></i> ${txt}</span></td>`;
              }).join('')}
            </tr>`;
          });
        }
      });

      // Gestion du cas "Aucun résultat"
      if(html === "") {
        html = `<tr><td colspan="5" style="text-align:center; padding:40px; color:#94a3b8; font-style:italic;">Aucun résultat trouvé pour "${query}"</td></tr>`;
      }
      
      tbody.innerHTML = html;
    }

    // 3. Écouteur d'événement sur la barre de recherche (temps réel)
    qInput.addEventListener("input", renderMatrix);

    // 4. Démarrage au chargement de la page
    document.addEventListener("DOMContentLoaded", () => {
      loadData();
    });

  </script>
</body>
</html>
